<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <!-- Form Header -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-3">
                        <a th:href="@{/cours/list}" class="btn btn-light btn-sm me-3">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <h2 class="mb-0">Associer des filières au cours</h2>
                            <p class="text-muted mb-0">
                                Cours: <strong th:text="${cour.codeCours + ' - ' + cour.intitule}"></strong>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/cours/associateFiliere}" method="post"
                      class="needs-validation" novalidate>

                    <input type="hidden" name="coursId" th:value="${cour.id}"/>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Sélectionnez les filières à associer
                        </label>
                        <select multiple class="form-select" name="filiereIds" size="8">
                            <option th:each="f : ${filieres}"
                                    th:value="${f.id}"
                                    th:text="${f.codeFiliere + ' - ' + f.nomFiliere}"
                                    th:selected="${cour.filieres != null && cour.filieres.contains(f)}">
                            </option>
                        </select>
                        <small class="text-muted">
                            Maintenez Ctrl (ou Cmd) pour sélectionner plusieurs filières.
                            Les filières déjà associées sont présélectionnées.
                        </small>
                    </div>

                    <!-- Current associations -->
                    <div th:if="${cour.filieres != null && !cour.filieres.isEmpty()}" class="mb-4">
                        <label class="form-label fw-semibold">Filières actuellement associées :</label>
                        <div class="d-flex flex-wrap gap-2">
                            <span th:each="f : ${cour.filieres}"
                                  class="badge bg-success badge-modern">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${f.nomFiliere}"></span>
                            </span>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="border-top mt-5 pt-4">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/cours/list}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Retour à la liste
                            </a>
                            <div>
                                <a th:href="@{/cours/edit/{id}(id=${cour.id})}" class="btn btn-outline-primary me-2">
                                    <i class="bi bi-pencil me-2"></i>Éditer le cours
                                </a>
                                <button type="submit" class="btn btn-success btn-modern">
                                    <i class="bi bi-check-circle me-2"></i>
                                    Mettre à jour les associations
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
