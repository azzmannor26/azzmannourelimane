<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1"> Gestion des Cours</h2>
                <p class="text-muted mb-0">Organisez vos matières académiques</p>
            </div>
            <a class="btn btn-primary btn-modern" th:href="@{/cours/new}">
                <i class="bi bi-plus-circle me-2"></i>Nouveau cours
            </a>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-modern table-hover">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Intitulé</th>
                    <th>Filières</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${cours}">
                    <td>
                        <span class="badge bg-primary badge-modern" th:text="${c.codeCours}"></span>
                    </td>
                    <td>
                        <strong th:text="${c.intitule}"></strong>
                    </td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                                <span th:each="f : ${c.filieres}"
                                      class="badge bg-secondary badge-modern"
                                      th:text="${f.nomFiliere}"></span>
                            <span th:if="${#lists.isEmpty(c.filieres)}"
                                  class="badge bg-warning badge-modern">
                                    Non assigné
                                </span>
                        </div>
                    </td>
                    <td class="text-end">
                        <div class="btn-group" role="group">
                            <a th:href="@{/cours/edit/{id}(id=${c.id})}"
                               class="btn btn-outline-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/cours/delete/{id}(id=${c.id})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Supprimer ce cours ?');">
                                <i class="bi bi-trash"></i>
                            </a>
                            <a th:href="@{/cours/associate/{id}(id=${c.id})}"
                               class="btn btn-outline-info btn-sm">
                                <i class="bi bi-link-45deg"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(cours)}">
                    <td colspan="4" class="text-center py-5">
                        <i class="bi bi-journal-text text-muted" style="font-size: 3rem;"></i>
                        <h4 class="text-muted mt-3">Aucun cours</h4>
                        <p class="text-muted">Commencez par créer votre premier cours</p>
                        <a th:href="@{/cours/new}" class="btn btn-primary">
                            <i class="bi bi-plus-circle me-2"></i>Créer un cours
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
