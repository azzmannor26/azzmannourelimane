<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <!-- Form Header -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-3">
                        <a th:href="@{/eleves/list}" class="btn btn-light btn-sm me-3">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <!-- CORRIGÉ : Utiliser &apos; au lieu de \' -->
                            <h2 class="mb-0" th:text="${eleve.id == null ? 'Nouvel élève' : 'Modifier élève'}"></h2>
                            <p class="text-muted mb-0">
                                Remplissez le formulaire ci-dessous
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/eleves/save}" th:object="${eleve}" method="post"
                      class="needs-validation" novalidate>

                    <input type="hidden" th:field="*{id}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Matricule
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               th:field="*{matricule}"
                               required
                               placeholder="Ex: MAT2024001">
                        <div class="invalid-feedback">
                            Le matricule est requis.
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Nom
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{nomEleve}"
                                   required
                                   placeholder="Ex: Dupont">
                            <div class="invalid-feedback">
                                Le nom est requis.
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Prénom
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{prenomEleve}"
                                   required
                                   placeholder="Ex: Jean">
                            <div class="invalid-feedback">
                                Le prénom est requis.
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Filière
                            <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" name="filiereId" required>
                            <option value="">Sélectionnez une filière</option>
                            <option th:each="f : ${filieres}"
                                    th:value="${f.id}"
                                    th:text="${f.nomFiliere}"
                                    th:selected="${eleve.filiere?.id == f.id}">
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            Veuillez sélectionner une filière.
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="border-top mt-5 pt-4">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/eleves/list}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-success btn-modern">
                                <i class="bi bi-check-circle me-2"></i>
                                <!-- CORRIGÉ : Trois solutions possibles -->

                                <!-- Solution 1 : Utiliser des guillemets doubles -->
                                <span th:text="${eleve.id == null ? 'Créer l''élève' : 'Enregistrer'}"></span>

                                <!-- OU Solution 2 : Utiliser &apos; (recommandé) -->
                                <!-- <span th:text="${eleve.id == null ? 'Créer l&apos;élève' : 'Enregistrer'}"></span> -->

                                <!-- OU Solution 3 : Simplifier le texte -->
                                <!-- <span th:text="${eleve.id == null ? 'Créer élève' : 'Enregistrer'}"></span> -->
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
