<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1"> Gestion des Filières</h2>
                <p class="text-muted mb-0">Organisez vos parcours académiques</p>
            </div>
            <a class="btn btn-success btn-modern" th:href="@{/filieres/new}">
                <i class="bi bi-plus-circle me-2"></i>Nouvelle filière
            </a>
        </div>

        <!-- Filières Grid -->
        <div class="row g-4">
            <div th:each="f : ${filieres}" class="col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm hover-lift">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <span class="badge bg-primary badge-modern mb-2" th:text="${f.codeFiliere}"></span>
                                <h5 class="card-title mb-1" th:text="${f.nomFiliere}"></h5>
                                <p class="text-muted small mb-0" th:text="${f.description ?: 'Pas de description'}"></p>
                            </div>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu">
                                    <li>
                                        <a class="dropdown-item" th:href="@{/filieres/edit/{id}(id=${f.id})}">
                                            <i class="bi bi-pencil me-2"></i>Modifier
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-danger"
                                           th:href="@{/filieres/delete/{id}(id=${f.id})}"
                                           onclick="return confirm('Supprimer cette filière ?');">
                                            <i class="bi bi-trash me-2"></i>Supprimer
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="border-top pt-3 mt-3">
                            <div class="row text-center">
                                <div class="col-6">
                                    <small class="text-muted d-block">Élèves</small>
                                    <strong class="h5">25</strong>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted d-block">Cours</small>
                                    <strong class="h5">8</strong>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <a th:href="@{/filieres/edit/{id}(id=${f.id})}"
                               class="btn btn-outline-primary btn-sm w-100">
                                <i class="bi bi-arrow-right me-1"></i>Gérer
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${filieres.empty}" class="text-center py-5">
            <div class="mb-3">
                <i class="bi bi-diagram-3 text-muted" style="font-size: 3rem;"></i>
            </div>
            <h4 class="text-muted">Aucune filière</h4>
            <p class="text-muted mb-4">Commencez par créer votre première filière</p>
            <a class="btn btn-success btn-modern" th:href="@{/filieres/new}">
                <i class="bi bi-plus-circle me-2"></i>Créer une filière
            </a>
        </div>
    </div>
</div>
