<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <!-- Form Header -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-3">
                        <a th:href="@{/filieres/list}" class="btn btn-light btn-sm me-3">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <h2 class="mb-0" th:text="${filiere.id == null ? 'Nouvelle filière' : 'Modifier filière'}"></h2>
                            <p class="text-muted mb-0">
                                Remplissez le formulaire ci-dessous
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/filieres/save}" th:object="${filiere}" method="post"
                      class="needs-validation" novalidate>

                    <input type="hidden" th:field="*{id}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Code
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               th:field="*{codeFiliere}"
                               required
                               placeholder="Ex: INFO-2024">
                        <div class="invalid-feedback">
                            Le code de la filière est requis.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Nom
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nomFiliere}"
                               required
                               placeholder="Ex: Informatique">
                        <div class="invalid-feedback">
                            Le nom de la filière est requis.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Description
                        </label>
                        <textarea class="form-control"
                                  th:field="*{description}"
                                  rows="4"
                                  placeholder="Décrivez cette filière..."></textarea>
                    </div>

                    <!-- Form Actions -->
                    <div class="border-top mt-5 pt-4">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/filieres/list}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-success btn-modern">
                                <i class="bi bi-check-circle me-2"></i>
                                <span th:text="${filiere.id == null ? 'Créer la filière' : 'Enregistrer'}"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
