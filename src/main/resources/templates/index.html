<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary mb-3">Bienvenue dans le système de gestion académique</h1>
            <p class="lead text-muted">Gérez efficacement les élèves, filières, cours et dossiers</p>
        </div>

        <div class="row g-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100 hover-shadow">
                    <div class="card-body text-center p-4">
                        <div class="icon-wrapper bg-primary bg-opacity-10 rounded-circle p-3 d-inline-flex mb-3">
                            <i class="bi bi-people-fill fs-2 text-primary"></i>
                        </div>
                        <h5 class="card-title">Élèves</h5>
                        <p class="card-text text-muted small">Gestion complète des étudiants</p>
                        <a class="btn btn-primary w-100 btn-modern" th:href="@{/eleves/list}">
                            <i class="bi bi-arrow-right me-2"></i>Accéder
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100 hover-shadow">
                    <div class="card-body text-center p-4">
                        <div class="icon-wrapper bg-success bg-opacity-10 rounded-circle p-3 d-inline-flex mb-3">
                            <i class="bi bi-diagram-3 fs-2 text-success"></i>
                        </div>
                        <h5 class="card-title">Filières</h5>
                        <p class="card-text text-muted small">Organisation des parcours</p>
                        <a class="btn btn-success w-100 btn-modern" th:href="@{/filieres/list}">
                            <i class="bi bi-arrow-right me-2"></i>Accéder
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100 hover-shadow">
                    <div class="card-body text-center p-4">
                        <div class="icon-wrapper bg-warning bg-opacity-10 rounded-circle p-3 d-inline-flex mb-3">
                            <i class="bi bi-journal-bookmark-fill fs-2 text-warning"></i>
                        </div>
                        <h5 class="card-title">Cours</h5>
                        <p class="card-text text-muted small">Gestion des matières</p>
                        <a class="btn btn-warning w-100 btn-modern" th:href="@{/cours/list}">
                            <i class="bi bi-arrow-right me-2"></i>Accéder
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100 hover-shadow">
                    <div class="card-body text-center p-4">
                        <div class="icon-wrapper bg-info bg-opacity-10 rounded-circle p-3 d-inline-flex mb-3">
                            <i class="bi bi-folder-fill fs-2 text-info"></i>
                        </div>
                        <h5 class="card-title">Dossiers</h5>
                        <p class="card-text text-muted small">Suivi administratif</p>
                        <a class="btn btn-info w-100 btn-modern" th:href="@{/dossiers/list}">
                            <i class="bi bi-arrow-right me-2"></i>Accéder
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
