<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="content-card">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <!-- Form Header -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-3">
                        <a th:href="@{/dossiers/list}" class="btn btn-light btn-sm me-3">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <div>
                            <h2 class="mb-0" th:text="${dossier.id == null ? 'Nouveau dossier' : 'Modifier dossier'}"></h2>
                            <p class="text-muted mb-0">
                                Remplissez le formulaire ci-dessous
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/dossiers/save}" th:object="${dossier}" method="post"
                      class="needs-validation" novalidate>

                    <input type="hidden" th:field="*{id}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Numéro d'inscription
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               th:field="*{numeroInscription}"
                               required
                               placeholder="Ex: DOS-2024-001">
                        <div class="invalid-feedback">
                            Le numéro d'inscription est requis.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Date de création
                        </label>
                        <input type="date"
                               class="form-control"
                               th:field="*{dateCreation}">
                        <small class="text-muted">Format: AAAA-MM-JJ</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Élève associé
                            <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" name="eleveId" required>
                            <option value="">Sélectionnez un élève</option>
                            <option th:each="e : ${eleves}"
                                    th:value="${e.id}"
                                    th:text="${e.matricule + ' - ' + e.nomEleve + ' ' + e.prenomEleve + ' (' + (e.filiere?.nomFiliere ?: 'Sans filière') + ')'}"
                                    th:selected="${dossier.eleve?.id == e.id}">
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            Veuillez sélectionner un élève.
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="border-top mt-5 pt-4">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/dossiers/list}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-success btn-modern">
                                <i class="bi bi-check-circle me-2"></i>
                                <span th:text="${dossier.id == null ? 'Créer le dossier' : 'Enregistrer'}"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
