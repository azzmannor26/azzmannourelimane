<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dossiers</title>
</head>
<body>
<div th:fragment="content">
    <div class="content-card">
        <!-- Header with actions -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1"> Gestion des Dossiers</h2>
                <p class="text-muted mb-0">Liste complète des dossiers administratifs</p>
            </div>
            <a class="btn btn-primary btn-modern" th:href="@{/dossiers/new}">
                <i class="bi bi-folder-plus me-2"></i>Nouveau dossier
            </a>
        </div>

        <!-- Search and filter -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="input-group">
                        <span class="input-group-text bg-light border-0">
                            <i class="bi bi-search"></i>
                        </span>
                    <input type="text" class="form-control border-0 bg-light" placeholder="Rechercher un dossier...">
                </div>
            </div>
            <div class="col-md-4">
                <select class="form-select bg-light border-0">
                    <option>Trier par: Date de création</option>
                    <option>Trier par: Numéro d'inscription</option>
                    <option>Trier par: Élève</option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-modern table-hover">
                <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Date création</th>
                    <th>Élève</th>
                    <th>Filière</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${dossiers}">
                    <td>
                        <span class="badge bg-info badge-modern" th:text="${d.numeroInscription}"></span>
                    </td>
                    <td>
                        <span th:text="${d.dateCreation != null ? #temporals.format(d.dateCreation, 'dd/MM/yyyy') : 'Non définie'}"></span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div th:if="${d.eleve != null}" class="avatar-placeholder bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center me-3"
                                 style="width: 40px; height: 40px;">
                                <span class="text-primary fw-bold" th:text="${d.eleve.prenomEleve != null ? d.eleve.prenomEleve.substring(0,1) : '?'}"></span>
                            </div>
                            <div th:if="${d.eleve != null}">
                                <strong th:text="${d.eleve.nomEleve + ' ' + d.eleve.prenomEleve}"></strong><br>
                                <small class="text-muted" th:text="${d.eleve.matricule}"></small>
                            </div>
                            <div th:unless="${d.eleve != null}">
                                <span class="text-muted">Non assigné</span>
                            </div>
                        </div>
                    </td>
                    <td>
                            <span th:if="${d.eleve?.filiere != null}"
                                  class="badge bg-secondary badge-modern"
                                  th:text="${d.eleve.filiere.nomFiliere}"></span>
                        <span th:unless="${d.eleve?.filiere != null}"
                              class="badge bg-warning badge-modern">
                                Non assigné
                            </span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group" role="group">
                            <a th:href="@{/dossiers/edit/{id}(id=${d.id})}"
                               class="btn btn-outline-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/dossiers/delete/{id}(id=${d.id})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce dossier ?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <!-- Empty state -->
                <tr th:if="${dossiers != null and #lists.isEmpty(dossiers)}">
                    <td colspan="5" class="text-center py-5">
                        <i class="bi bi-folder text-muted" style="font-size: 3rem;"></i>
                        <h4 class="text-muted mt-3">Aucun dossier</h4>
                        <p class="text-muted">Commencez par créer votre premier dossier</p>
                        <a th:href="@{/dossiers/new}" class="btn btn-primary">
                            <i class="bi bi-folder-plus me-2"></i>Créer un dossier
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <div>
                <span class="text-muted">Total: <strong th:text="${dossiers != null ? #lists.size(dossiers) : 0}">0</strong> dossier(s)</span>
            </div>
            <nav>
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled">
                        <a class="page-link" href="#" tabindex="-1">Précédent</a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#">Suivant</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
