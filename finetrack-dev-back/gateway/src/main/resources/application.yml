server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive

  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gatewaydb

  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Transfer-Encoding
        - RemoveResponseHeader=Transfer-Encoding
        - AddResponseHeader=X-Correlation-Id, ${CORRELATION_ID:${random.uuid}}
      routes:
        - id: project
          uri: http://project:8081
          predicates: [ Path=/api/projects/** ]
        - id: card
          uri: http://card:8082
          predicates: [ Path=/api/cards/** ]
        - id: transaction
          uri: http://transaction:8080
          predicates: [ Path=/api/transactions/**, Method=GET ]
        - id: approval
          uri: http://approval:8080
          predicates: [ Path=/api/approvals/** ]
        - id: accounting
          uri: http://accounting:8080
          predicates:
            - Path=/api/accounting/**
            - Path=/api/exports/**

        - id: file
          uri: http://file:8080
          predicates: [ Path=/api/files/** ]
        - id: notification
          uri: http://notification:8087
          predicates: [ Path=/api/notify/** ]

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"     # Next dev
            allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
            allowedHeaders: [ "*" ]
            allowCredentials: true

security:
  jwt:
    issuer: finetrack-auth
    # At least 32+ chars. CHANGE this in prod and keep it secret.
    secret: "U6a8oR0J0nJ9C2n2x5Ww7mZ2zKz3bqI8b0x8JwM1m6U=29"
    access-ttl: 15m
    refresh-ttl: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web: DEBUG
    com.finetrack: DEBUG